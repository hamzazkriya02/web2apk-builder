name: Build ProBrowser APK

on:
  repository_dispatch:
    types:
      - build_probrowser

permissions:
  contents: read

concurrency:
  group: probrowser-${{ github.event.client_payload.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      APP_KEY: ${{ github.event.client_payload.app_key }}
      APPLICATION_ID: ${{ github.event.client_payload.application_id }}
      LOGO_URL: ${{ github.event.client_payload.logo_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Show build information
        run: |
          echo "Build ID: $BUILD_ID"
          echo "App Name: $APP_NAME"
          echo "App Key: $APP_KEY"
          echo "Application ID: $APPLICATION_ID"

      - name: Notify cPanel - Building
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=building" \
            -F "build_type=probrowser" \
            -F "message=Creating ProBrowser Android APK..." \
            "${{ secrets.CPANEL_BASE_URL }}/api/probrowser-build-update.php"

      - name: Configure ProBrowser
        run: |
          python3 probrowser/scripts/configure_probrowser.py

      - name: Build ProBrowser APK
        working-directory: probrowser
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK to cPanel
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=ready" \
            -F "build_type=probrowser" \
            -F "apk=@probrowser/app/build/outputs/apk/debug/app-debug.apk;type=application/vnd.android.package-archive" \
            "${{ secrets.CPANEL_BASE_URL }}/api/probrowser-build-update.php"

      - name: Notify cPanel - Failed
        if: failure()
        run: |
          curl --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=failed" \
            -F "build_type=probrowser" \
            -F "message=ProBrowser Android build failed." \
            "${{ secrets.CPANEL_BASE_URL }}/api/probrowser-build-update.php" || true
