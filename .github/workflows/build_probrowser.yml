name: Build ProBrowser APK

on:
  repository_dispatch:
    types:
      - build_probrowser

permissions:
  contents: read

concurrency:
  group: probrowser-${{ github.event.client_payload.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      APP_KEY: ${{ github.event.client_payload.app_key }}
      APPLICATION_ID: ${{ github.event.client_payload.application_id }}
      LOGO_URL: ${{ github.event.client_payload.logo_url }}
      CALLBACK_URL: ${{ secrets.PROBROWSER_BASE_URL }}/api/probrowser-callback.php

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify Gradle
        run: gradle --version

      - name: Install image processor
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0

      - name: Notify building
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=building" \
            -F "message=Creating ProBrowser Android APK..." \
            "$CALLBACK_URL"

      - name: Configure ProBrowser
        run: python3 probrowser/scripts/configure_probrowser.py

      - name: Build installable APK
        working-directory: probrowser
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Notify uploading
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=uploading" \
            -F "message=Uploading APK to cPanel..." \
            "$CALLBACK_URL"

      - name: Upload APK to cPanel
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=ready" \
            -F "message=APK ready." \
            -F "apk=@probrowser/app/build/outputs/apk/debug/app-debug.apk;type=application/vnd.android.package-archive" \
            "$CALLBACK_URL"

      - name: Notify failure
        if: failure()
        run: |
          curl --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=failed" \
            -F "message=Android build failed. Open GitHub Actions for the error log." \
            "$CALLBACK_URL" || true
