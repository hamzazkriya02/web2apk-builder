name: Build temporary APK

on:
  repository_dispatch:
    types:
      - build_apk

permissions:
  contents: read

concurrency:
  group: apk-${{ github.event.client_payload.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      WEBSITE_URL: ${{ github.event.client_payload.website_url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install image processor
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0

      - name: Notify building
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=building" \
            -F "message=Creating Android WebView package..." \
            "${{ secrets.CPANEL_BASE_URL }}/api/build-update.php"

      - name: Download and configure brand
        env:
          LOGO_URL: ${{ github.event.client_payload.logo_url }}
          LOGO_PATH: build-logo
        run: |
          curl --fail-with-body --show-error \
            --location \
            --max-filesize 4194304 \
            "$LOGO_URL" \
            -o "$LOGO_PATH"
          python3 scripts/configure_build.py

      - name: Build installable APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK to cPanel
        run: |
          curl --fail-with-body --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=ready" \
            -F "apk=@app/build/outputs/apk/debug/app-debug.apk;type=application/vnd.android.package-archive" \
            "${{ secrets.CPANEL_BASE_URL }}/api/build-update.php"

      - name: Notify failure
        if: failure()
        run: |
          curl --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CPANEL_CALLBACK_TOKEN }}" \
            -F "build_id=$BUILD_ID" \
            -F "status=failed" \
            -F "message=Android build failed. Please try again." \
            "${{ secrets.CPANEL_BASE_URL }}/api/build-update.php" || true